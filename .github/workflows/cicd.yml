# Run checks on every branch and publish successful main builds to PyPI.
name: CI/CD

on:
  push:
    branches:
      - '**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
      - name: Run type, formatting, and test checks
        run: |
          poetry run mypy optionlab/ --ignore-missing-imports
          poetry run black . --check --diff --color
          poetry run pytest -m "not benchmark"

  publish:
    name: Publish to pypi.org
    if: github.event.ref == 'refs/heads/main'
    needs: [ tests ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment
      - name: Build and publish
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish --build --no-interaction
